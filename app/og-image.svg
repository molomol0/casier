<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="1.1" stop-color="#cf9a5c"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#15110c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#2a2420" stroke-width="2"/>
  <!-- monogramme C -->
  <path d="M150 250 A70 70 0 1 0 150 360" fill="none" stroke="#cf9a5c" stroke-width="26" stroke-linecap="round"/>
  <text x="96" y="470" font-family="'Space Grotesk',Arial,sans-serif" font-size="150" font-weight="700" fill="url(#word)">Casier</text>
  <text x="100" y="545" font-family="Arial,sans-serif" font-size="40" fill="#b8b2aa">Le casier judiciaire des personnalités françaises.</text>
  <text x="100" y="598" font-family="Arial,sans-serif" font-size="40" fill="#8a847c">Deux cartes, une question : qui en a le plus ?</text>
